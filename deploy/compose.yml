# Generated by python3 deploy/prepare.py; edit the generator and manifest.
name: ahp-hosted
services:
  auth:
    image: ahp/backend:${AHP_IMAGE_TAG:-local}
    build: &id001
      context: ..
      dockerfile: deploy/Dockerfile
      target: backend
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: &id002
    - /tmp:size=32m,mode=1777
    cap_drop: &id003
    - ALL
    security_opt: &id004
    - no-new-privileges:true
    networks: &id005
    - private
    volumes: &id006
    - type: bind
      source: ${AHP_DB_CA_FILE:-./database-ca.crt}
      target: /run/config/database-ca.crt
      read_only: true
      bind:
        create_host_path: false
    logging: &id007
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 30s
    working_dir: /repo/services/auth
    command:
    - node
    - --import
    - tsx
    - src/index.ts
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Configure the managed database}
      JWT_SECRET: ${JWT_SECRET:?Generate deployment secrets}
      JWT_ISSUER: a-health
      JWT_AUDIENCE: a-health-api
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?Generate deployment secrets}
      AUTH_SERVICE_URL: http://auth:4001
      PATIENT_SERVICE_URL: http://patient:4002
      DOCTOR_SERVICE_URL: http://doctor:4003
      APPOINTMENT_SERVICE_URL: http://appointment:4004
      CONSULTATION_SERVICE_URL: http://consultation:4005
      MESSAGING_SERVICE_URL: http://messaging:4006
      FOLLOWUP_SERVICE_URL: http://followup:4007
      NOTIFICATION_SERVICE_URL: http://notification:4008
      AI_SERVICE_URL: http://ai:4009
      EMERGENCY_SERVICE_URL: http://emergency:4010
      PHARMACY_SERVICE_URL: http://pharmacy:4011
      PAYMENT_SERVICE_URL: http://payment:4012
      DIAGNOSTICS_SERVICE_URL: http://diagnostics:4013
      QUALITY_SERVICE_URL: http://quality:4014
      FAMILIES_SERVICE_URL: http://families:4015
      EDUCATION_SERVICE_URL: http://education:4016
      NETWORK_SERVICE_URL: http://network:4017
      INSURANCE_SERVICE_URL: http://insurance:4018
      RESEARCH_SERVICE_URL: http://research:4019
      SURVEILLANCE_SERVICE_URL: http://surveillance:4020
      GATEWAY_SERVICE_URL: http://gateway:4021
      SYNC_SERVICE_URL: http://sync:4022
      DEVICES_SERVICE_URL: http://devices:4023
      PREVENTION_SERVICE_URL: http://prevention:4024
      FACILITIES_SERVICE_URL: http://facilities:4025
      PORT: '4001'
      HOST: 0.0.0.0
      SMS_PROVIDER: africastalking
      AT_ENVIRONMENT: live
      AT_USERNAME: ${AT_USERNAME:?Configure live SMS}
      AT_API_KEY: ${AT_API_KEY:?Configure live SMS}
      SMS_SENDER_ID: ${SMS_SENDER_ID:?Configure approved sender ID}
      AUTH_LOCAL_OTP_MODE: 'false'
      OTP_ECHO_IN_RESPONSE: 'false'
      OTP_LOG_TO_CONSOLE: 'false'
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 40s
